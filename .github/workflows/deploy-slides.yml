name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'SLIDES.md'
      - '.github/workflows/deploy-slides.yml'

# Grant permissions needed to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Slides with Marp CLI
        uses: marp-team/marp-cli-action@v1
        with:
          args: SLIDES.md -o build/index.html --html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4